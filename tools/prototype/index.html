<style>

:root{--ink:#f2ece1;--gold:#c6a46a;--black:#101010}

</style></head><body>
<canvas id="c"></canvas><div class="vignette"></div><div class="grain"></div>
<nav><div class="logo">ORVESSA</div>
<div class="links"><a class="on">HOME</a><a>COLLECTIONS</a><a>OUR STORY</a><a>CRAFTSMANSHIP</a></div>
<div class="util"><span>SEARCH</span><span>ACCOUNT</span><span>WISHLIST</span><span class="bag">BAG (0)</span></div></nav>
<div class="title" id="title"></div>
<div class="ch l" id="chl"></div><div class="ch r" id="chr"></div>
<script type="module">
import { MaisonScene } from '/scene/hall/MaisonScene.js'
const T = {
  hall:{pre:'(ORVESSA PRESENTS)',l1:'BEAUTY THAT',l2:'Transcends Time',l:['CH. I','La Maison'],r:['CH. II','Collections']},
  maison:{pre:'(CH. I)',l1:'LA',l2:'Maison',cta:'OUR STORY',l:['CH. III','Atelier'],r:['CH. II','Collections']},
  atelier:{pre:'(CH. III)',l1:'THE',l2:'Atelier',cta:'CRAFTSMANSHIP',l:['CH. II','Collections'],r:['CH. I','La Maison']},
  collections:{pre:'(CH. II)',l1:'THE',l2:'Collections',cta:'DISCOVER',l:['CH. I','La Maison'],r:['CH. III','Atelier']}
}
const q = new URLSearchParams(location.search); if (q.get('clean')) document.head.insertAdjacentHTML('beforeend','<style>nav,.title,.ch,.spot,.grain{display:none!important}</style>'); const view = q.get('v') || 'hall'; const focus = q.get('f')
document.documentElement.style.setProperty('--lift', view === 'hall' ? '22vh' : '30vh')
const t = T[view]
document.getElementById('title').innerHTML = `<div class="pre">${t.pre}</div><div class="l1">${t.l1}</div><div class="l2">${t.l2}</div>${t.cta?`<button class="cta">${t.cta}</button>`:''}`
document.getElementById('chl').innerHTML = `<div class="arrow">←</div><div class="txt"><small>(${t.l[0]})</small><b>${t.l[1]}</b></div>`
document.getElementById('chr').innerHTML = `<div class="arrow">→</div><div class="txt"><small>(${t.r[0]})</small><b>${t.r[1]}</b></div>`
const s = new MaisonScene(document.getElementById('c'))
s.setView(view)
if (q.get('p')) { s.setProgress(+q.get('p')); document.getElementById('title').style.display='none' }

if (focus) {

}
s.renderFrame(); s.renderFrame()
if (!focus) for (const h of s.projectHotspots(innerWidth, innerHeight)) document.body.insertAdjacentHTML('beforeend', `<div class="spot" style="left:${h.x}px;top:${h.y}px"><svg viewBox="0 0 54 30"><path d="M2 15 Q27 -6 52 15 Q27 36 2 15Z" fill="none" stroke="#f2ece1" stroke-width="1.4"/><circle cx="27" cy="15" r="8" fill="#c6a46a"/></svg></div>`)
